[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratacredit"
version = "0.1.0"
description = "Loan-Level Structured Credit Analytics & Pool Selection Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
 { name = "StrataCredit" },
]
keywords = ["mortgage", "structured-finance", "credit-analytics", "securitization"]
classifiers = [
 "Development Status :: 3 - Alpha",
 "Intended Audience :: Financial and Insurance Industry",
 "Programming Language :: Python :: 3",
 "Programming Language :: Python :: 3.10",
 "Programming Language :: Python :: 3.11",
 "Programming Language :: Python :: 3.12",
]
dependencies = [
 "polars>=0.20.0",
 "duckdb>=0.10.0",
 "pyarrow>=14.0.0",
 "great-expectations>=0.18.0",
 "scikit-learn>=1.4.0",
 "xgboost>=2.0.0",
 "mlflow>=2.10.0",
 "streamlit>=1.32.0",
 "starlette>=0.49.0",
 "plotly>=5.20.0",
 "pyyaml>=6.0.1",
 "pandas>=2.2.0",
 "numpy>=1.26.0",
 "scipy>=1.12.0",
 "openpyxl>=3.1.2",
 "jinja2>=3.1.3",
 "click>=8.1.7",
 "rich>=13.7.0",
 "python-dateutil>=2.9.0",
 "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
 "pytest>=8.0.0",
 "pytest-cov>=4.1.0",
 "pytest-xdist>=3.5.0",
 "ruff>=0.3.0",
 "mypy>=1.8.0",
 "ipykernel>=6.29.0",
 "jupyterlab>=4.1.0",
]
optimization = [
 "pulp>=2.7.0",
 "ortools>=9.8.0",
]
api = [
 "fastapi>=0.120.0",
 "uvicorn>=0.29.0",
 "httpx>=0.27.0",
]

[project.scripts]
stratacredit = "stratacredit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stratacredit"]

[tool.hatch.envs.default]
dependencies = [
 "pytest",
 "pytest-cov",
 "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
 "--tb=short",
 "-v",
 "--cov=src/stratacredit",
 "--cov-report=term-missing",
 "--cov-report=html:htmlcov",
]
markers = [
 "unit: fast isolated unit tests",
 "data: data validation and schema tests",
 "regression: golden fixture regression tests",
 "integration: end-to-end integration tests (slow)",
 "smoke: minimal smoke tests for CI",
]

[tool.coverage.run]
source = ["src/stratacredit"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
 "pragma: no cover",
 "def __repr__",
 "raise NotImplementedError",
 "if TYPE_CHECKING:",
]
